<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GSS Playground</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080808;
      }
      body {
        display: grid;
        grid-template-columns: minmax(300px, 36%) 1fr;
      }

      /* ----- The editor, docked on the left ----- */
      .editor {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #111114;
        color: #e6e6e6;
        border-right: 1px solid #26262c;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .editor header {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        font-size: 12px;
        color: #9a9aa3;
        border-bottom: 1px solid #26262c;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 8px;
        background: #1b1b20;
      }
      .tabs button,
      .editor select,
      #share {
        padding: 4px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #9a9aa3;
        font: inherit;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        background: #2b2b33;
        color: #e6e6e6;
      }
      .editor select {
        background: #1b1b20;
        max-width: 11rem;
      }
      #share {
        background: #e6e6e6;
        color: #111114;
      }
      .spacer {
        flex: 1;
      }
      .status {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
      }
      .status.ok {
        background: #12351f;
        color: #5fd38d;
      }
      .status.error {
        background: #3d1515;
        color: #ff7a7a;
      }
      /* The code: a CodeMirror editor (src/runtime/editor.ts), or the GLSL it becomes */
      .code-host {
        flex: 1;
        min-height: 0;
        font-size: 13px;
      }
      .code-host[hidden] {
        display: none;
      }
      .editor pre.error {
        margin: 0;
        max-height: 30%;
        overflow: auto;
        padding: 0.75rem 1rem;
        border-top: 1px solid #4a1f1f;
        background: #2a1212;
        color: #ff9b9b;
        font: inherit;
        font-size: 12px;
        white-space: pre-wrap;
      }

      /* ----- The scene ----- */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        touch-action: none;
        cursor: grab;
      }

      /* On a phone: the scene on top, the editor below */
      @media (max-width: 720px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 40vh;
        }
        .editor {
          order: 2;
          border-right: 0;
          border-top: 1px solid #26262c;
        }
      }
    </style>
  </head>
  <body>
    <aside class="editor">
      <header>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="gss" aria-selected="true">GSS</button>
          <button type="button" role="tab" data-tab="glsl" aria-selected="false">GLSL</button>
        </div>
        <select id="examples" aria-label="Examples">
          <option value="" selected disabled>Examples…</option>
        </select>
        <span class="spacer"></span>
        <span id="status" class="status ok">OK</span>
        <button type="button" id="share">Share</button>
      </header>
      <div id="code" class="code-host"></div>
      <div id="glsl" class="code-host" hidden></div>
      <pre id="error" class="error" hidden></pre>
    </aside>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
