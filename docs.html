<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSS — Reference</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 760px;
        padding: 2rem 1rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #1a1a1f;
      }
      code,
      pre {
        font-family: ui-monospace, monospace;
      }
      pre {
        background: #f4f1ea;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      .property {
        border-top: 1px solid #ddd;
        padding: 1.5rem 0;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0;
      }
      .toc {
        background: #f4f1ea;
        padding: 1rem 1.25rem;
        border-radius: 8px;

        /* use https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/animation-timeline/scroll */
      }
      .toc h2 {
        margin-top: 0;
      }
      .toc h3 {
        margin: 1rem 0 0.25rem;
        font-size: 1rem;
      }
      .toc ul {
        columns: 11rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .toc a {
        color: inherit;
      }

      /* ----- Examples and their "Try it" button ----- */
      .example {
        position: relative;
      }
      .example pre {
        padding-right: 6rem; /* room for the button */
        font-size: 13px;
        line-height: 1.5;
      }
      .example.is-open pre {
        display: none; /* the editor shows the same code */
      }
      .try {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        padding: 0.3rem 0.7rem;
        border: 1px solid #d8d2c4;
        border-radius: 999px;
        background: #fff;
        color: #1a1a1f;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .try:hover {
        border-color: #1a1a1f;
      }

      /* ----- The live playground under an example ----- */
      .playground {
        overflow: hidden;
        margin: 1em 0;
        border-radius: 8px;
        background: #111114;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .playground-bar {
        display: flex;
        min-height: 2.6rem;
        box-sizing: border-box;
        gap: 0.75rem;
        align-items: center;
        padding: 0.5rem 6rem 0.5rem 0.75rem; /* room for the Close button on the right */
        border-bottom: 1px solid #26262c;
        font-size: 12px;
        color: #9a9aa3;
      }
      .playground-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 300px;
      }
      .playground textarea {
        min-width: 0;
        margin: 0;
        padding: 0.75rem;
        border: 0;
        border-right: 1px solid #26262c;
        outline: none;
        resize: none;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 13px;
        line-height: 1.6;
        tab-size: 2;
        white-space: pre;
      }
      .playground canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        touch-action: none;
        cursor: grab;
      }
      .playground .error {
        margin: 0;
        padding: 0.6rem 0.75rem;
        border-radius: 0;
        background: #2a1212;
        color: #ff9b9b;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .status {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
      }
      .status.ok {
        background: #12351f;
        color: #5fd38d;
      }
      .status.error {
        background: #3d1515;
        color: #ff7a7a;
      }
      @media (max-width: 600px) {
        .playground-body {
          grid-template-columns: 1fr;
          grid-template-rows: auto 240px;
          height: auto;
        }
        .playground textarea {
          height: 180px;
          border-right: 0;
          border-bottom: 1px solid #26262c;
        }
        .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="docs"></main>
    <script type="module" src="/src/docs/main.ts"></script>
  </body>
</html>
