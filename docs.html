<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GSS — Reference</title>
    <meta
      name="description"
      content="Selectors, the cascade and @keyframes, compiled into a single raymarching shader. The 3D language designers and AIs already speak."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GSS" />
    <meta property="og:url" content="https://www.gss-lang.dev/docs" />
    <meta property="og:title" content="GSS — Reference" />
    <meta
      property="og:description"
      content="Selectors, the cascade and @keyframes, compiled into a single raymarching shader. The 3D language designers and AIs already speak."
    />
    <meta
      property="og:image"
      content="https://www.gss-lang.dev/marks/social-docs.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The GSS reference: the material property"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.gss-lang.dev/docs" />
    <link rel="stylesheet" href="/src/styles/site.css" />
    <style>
      /* The look comes from DESIGN.md; the values from src/styles/tokens.css.
         The page itself is generated by src/docs/render.ts: only its look lives here. */
      html {
        scroll-padding-top: 72px; /* an anchor lands under the top bar, not behind it */
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      :not(pre) > code {
        font-size: 0.9em;
        color: var(--gss-bone);
      }

      /* ----- The top bar, like the playground's ----- */
      .topbar .to-playground {
        display: inline-flex;
        align-items: center;
        height: var(--gss-control-height);
        padding: 0 14px;
        border: 1px solid var(--gss-signal);
        border-radius: var(--gss-radius-control);
        color: var(--gss-signal);
      }
      .topbar .to-playground:hover {
        background: var(--gss-signal);
        color: var(--gss-void);
        text-decoration: none;
      }

      /* ----- The page (design/reference/png/03-docs.png): contents on the left,
         one entry in the middle, "On this page" on the right. src/docs/pages.ts
         shows one entry at a time and adds the breadcrumb, the pager and the right column. */
      #docs {
        box-sizing: border-box;
        max-width: 1320px;
        margin: 0 auto;
      }
      @media (min-width: 1024px) {
        #docs {
          display: grid;
          grid-template-columns: 260px minmax(0, 1fr) 220px;
          align-items: start;
          min-height: calc(100dvh - 53px);
        }
        #docs > * {
          grid-column: 2;
        }
        #docs > .toc-slot,
        #docs > .on-this-page {
          grid-row: 1 / span 20;
          align-self: stretch;
        }
        #docs > .toc-slot {
          grid-column: 1;
          border-right: 1px solid var(--gss-line);
        }
        #docs > .on-this-page {
          grid-column: 3;
          border-left: 1px solid var(--gss-line);
        }
        .toc,
        .on-this-page > div {
          position: sticky;
          top: 53px;
        }
        .toc {
          max-height: calc(100dvh - 53px);
          overflow: auto;
          box-sizing: border-box;
          padding: 28px 24px 48px;
        }
        .toc-toggle {
          pointer-events: none; /* always open on a large screen */
        }
      }
      #docs > header,
      #docs > section {
        padding: 48px 56px 0;
      }

      /* ----- Header (first page only) ----- */
      #docs header h1 {
        margin: 0;
        font-family: var(--gss-font-display);
        font-weight: 800;
        font-size: clamp(36px, 6vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.05em;
      }
      .tagline {
        margin: 16px 0 0;
        max-width: 38rem;
        font-size: 19px;
        color: var(--gss-ash);
      }

      /* ----- Contents ----- */
      .toc {
        font-family: var(--gss-font-code);
        font-size: 13px;
        scrollbar-width: thin;
        scrollbar-color: var(--gss-isoline) transparent;
      }
      .toc h2 {
        margin: 0 0 20px;
      }
      .toc-toggle {
        padding: 0;
        border: 0;
        background: none;
        font: 600 15px var(--gss-font-display);
        color: var(--gss-bone);
        cursor: pointer;
      }
      .docs-footer {
        padding: 24px;
        color: var(--gss-dim);
        border-top: 1px solid var(--gss-line);
        font-size: 12px;
      }
      /* A dense nav, like a reference: a group and a page are one 28px row.
         Touch screens get 44px, below. */
      .toc-group {
        margin: 0;
      }
      .toc-group > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        box-sizing: border-box;
        padding: 3px 10px;
        border: 1px solid transparent;
        border-radius: 4px;
        list-style: none;
        color: var(--gss-ash);
        cursor: pointer;
        user-select: none;
      }
      .toc-group > summary::-webkit-details-marker {
        display: none;
      }
      .toc-group > summary::marker {
        content: "";
      }
      .toc-group > summary:hover {
        background: var(--gss-raised);
        color: var(--gss-bone);
      }
      .toc-group > summary:focus-visible {
        outline: 2px solid var(--gss-signal);
        outline-offset: -2px;
        background: var(--gss-raised);
      }
      .toc-group[open] > summary {
        color: var(--gss-bone);
      }
      .toc-group[data-current] > summary {
        color: var(--gss-signal);
      }
      /* The icon of a group takes the colour of its title: ash, bone, signal on the page being read.
         Its motion on hover comes with the contents. */
      .toc-icon {
        flex: none;
      }
      .toc-group-title {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
      }
      .toc-group-count {
        font-size: 10px;
        color: var(--gss-dim);
        font-variant-numeric: tabular-nums;
      }
      .toc-group[data-current] .toc-group-count {
        color: var(--gss-signal);
      }
      .toc-chevron {
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        transition: transform 150ms ease;
      }
      .toc-group[open] > summary .toc-chevron {
        transform: rotate(90deg);
      }
      .toc .toc-group > ul {
        margin: 0 0 6px 10px;
        border-left: 1px solid var(--gss-line);
      }
      .toc .toc-group li a {
        margin-left: 0;
        overflow-wrap: anywhere;
      }
      @media (pointer: coarse) {
        .toc-group > summary {
          min-height: 44px;
        }
        .toc .toc-group li a {
          padding-block: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .toc-chevron {
          transition: none;
        }
      }
      .toc .toc-category {
        color: var(--gss-dim);
      }
      .toc h3 {
        margin: 18px 0 6px;
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .toc h3 a {
        color: var(--gss-dim);
      }
      .toc ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .toc li a {
        display: block;
        padding: 4px 10px;
        margin-left: -12px;
        border-left: 2px solid transparent;
        color: var(--gss-ash);
      }
      .toc a:hover {
        color: var(--gss-bone);
        text-decoration: none;
      }
      /* The current page: bone on raised, a 2px signal rule (DESIGN.md § 6) */
      .toc li a[aria-current="page"] {
        border-left-color: var(--gss-signal);
        background: var(--gss-raised);
        color: var(--gss-bone);
      }
      .toc code {
        font-size: inherit;
        color: inherit;
      }
      @media (max-width: 1023px) {
        .toc {
          margin: 16px 24px 0;
          padding: 14px 18px;
          border: 1px solid var(--gss-line);
          background: var(--gss-surface);
        }
        .toc h2 {
          margin: 0;
        }
        .toc-toggle::after {
          content: " ▾";
          color: var(--gss-dim);
        }
        .toc:not(.open) .toc-nav {
          display: none;
        }
        .toc.open .toc-nav {
          margin-top: 8px;
        }
        .toc ul {
          columns: 1;
        }
        .toc li a {
          margin-left: 0;
        }
        #docs > header,
        #docs > section {
          padding: 32px 24px 0;
        }
        .on-this-page {
          display: none;
        }
      }

      /* ----- On this page ----- */
      .on-this-page .label {
        padding: 48px 24px 10px;
        font: 11px var(--gss-font-code);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gss-dim);
      }
      .on-this-page ul {
        margin: 0;
        padding: 0 24px;
        list-style: none;
        font: 12px/2 var(--gss-font-code);
      }
      .on-this-page ul a {
        color: var(--gss-dim);
      }
      .on-this-page ul a:hover {
        color: var(--gss-bone);
        text-decoration: none;
      }
      .on-this-page .to-playground {
        display: block;
        margin: 24px;
        padding: 10px 12px;
        border: 1px solid var(--gss-signal);
        border-radius: var(--gss-radius-control);
        color: var(--gss-signal);
        font: 12px var(--gss-font-code);
      }
      .on-this-page .to-playground:hover {
        background: var(--gss-signal);
        color: var(--gss-void);
        text-decoration: none;
      }

      /* ----- One entry, as a page ----- */
      .paged > section > h2 {
        display: none; /* the breadcrumb says it */
      }
      .page-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin-bottom: 18px;
      }
      .crumbs {
        font: 12px var(--gss-font-code);
        color: var(--gss-dim);
      }
      .crumbs span {
        color: var(--gss-signal);
      }
      /* Copy page ▾ — Markdown for LLMs (src/docs/copy-page.ts) */
      .copy-page {
        position: relative;
        flex-shrink: 0;
      }
      .copy-page-trigger {
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--gss-isoline);
        border-radius: var(--gss-radius-control);
        background: transparent;
        color: var(--gss-ash);
        font: 12px var(--gss-font-code);
        text-transform: lowercase;
        cursor: pointer;
        transition:
          color var(--gss-transition),
          border-color var(--gss-transition),
          background-color var(--gss-transition);
      }
      .copy-page-trigger:hover,
      .copy-page-trigger[aria-expanded="true"] {
        border-color: var(--gss-ash);
        color: var(--gss-bone);
        background: var(--gss-raised);
      }
      .copy-page-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 20;
        min-width: 260px;
        padding: 4px;
        border: 1px solid var(--gss-line);
        border-radius: var(--gss-radius-control);
        background: var(--gss-raised);
      }
      .copy-page-item {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: var(--gss-radius-control);
        background: transparent;
        color: var(--gss-ash);
        font: 12px/1.4 var(--gss-font-code);
        text-align: left;
        text-transform: lowercase;
        cursor: pointer;
      }
      .copy-page-item:hover {
        background: var(--gss-isoline);
        color: var(--gss-bone);
      }
      .property,
      .guide {
        max-width: 760px;
        padding-bottom: 72px;
      }
      .property h3,
      .guide h3 {
        margin: 0 0 20px;
        font-family: var(--gss-font-display);
        font-weight: 800;
        font-size: clamp(34px, 5vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.05em;
      }
      .property h3 code {
        font-size: inherit;
        color: var(--gss-bone);
      }
      /* "light (sun)": which of two entries of the same name this page is */
      .property h3 small {
        font-size: 0.42em;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--gss-dim);
      }
      .property > p,
      .guide p {
        max-width: 65ch;
        margin: 0 0 20px;
        font-size: 17px;
        color: var(--gss-ash);
      }
      .guide p code,
      .property > p code {
        color: var(--gss-bone);
      }
      /* A note under the description: what to know before trying it. Like the notes
         of DESIGN.md: a 1px dashed isoline box, a mono keyword in signal, no fill */
      .callout {
        max-width: 65ch;
        margin: 0 0 24px;
        padding: 14px 16px;
        border: 1px dashed var(--gss-isoline);
      }
      .callout .keyword {
        margin-right: 6px;
        color: var(--gss-signal);
        font: 12px var(--gss-font-code);
      }
      .callout p {
        margin: 0;
        font-size: 15px;
        color: var(--gss-ash);
      }
      .callout strong {
        color: var(--gss-bone);
        font-weight: 600;
      }
      /* The chapters of a page (Values, a chapter of a guide) and the name of each example:
         Martian Mono speaks, like the titles; the sentence under it is prose */
      .property h4,
      .guide h4 {
        margin: 44px 0 14px;
        font: 600 18px/1.25 var(--gss-font-display);
        letter-spacing: -0.03em;
        color: var(--gss-bone);
        scroll-margin-top: 72px;
      }
      .example-text {
        max-width: 65ch;
        margin: 0 0 16px;
        font-size: 16px;
        color: var(--gss-ash);
      }
      .example-text code,
      .values dd code {
        color: var(--gss-bone);
      }
      /* What each value does: the value in code, what it does in prose */
      .values {
        grid-template-columns: minmax(140px, 32%) minmax(0, 1fr);
        column-gap: 24px;
      }
      .values dt {
        text-transform: none;
      }
      .values dd {
        font: 15px/1.5 var(--gss-font-body);
        color: var(--gss-ash);
      }
      /* Under a chapter of a guide: what it needs, in mono, like a label */
      .guide p.guide-meta {
        margin: -6px 0 12px;
        font: 12px var(--gss-font-code);
        color: var(--gss-dim);
      }
      /* A table in a guide page: method and syntax names keep their case */
      .guide-table dt {
        text-transform: none;
      }
      .guide-table dd {
        color: var(--gss-ash);
      }

      /* ----- The live demo of "Set variables from JavaScript" ----- */
      .variables-demo {
        margin: 0 0 28px;
        border: 1px solid var(--gss-line);
        background: var(--gss-surface);
      }
      .variables-demo gss-scene {
        aspect-ratio: 2 / 1;
        background: var(--gss-void);
      }
      .variables-demo label {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 44px;
        padding: 0 14px;
        border-top: 1px solid var(--gss-line);
        font: 12px var(--gss-font-code);
        color: var(--gss-ash);
      }
      .variables-demo input {
        flex: 1;
        min-width: 0;
        margin: 0;
        accent-color: var(--gss-signal);
      }
      .variables-demo output {
        min-width: 4ch;
        text-align: right;
        color: var(--gss-bone);
        font-variant-numeric: tabular-nums;
      }
      /* Previous / next */
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid var(--gss-line);
        font: 13px var(--gss-font-code);
      }
      .pager a {
        color: var(--gss-ash);
      }
      .pager a:hover {
        color: var(--gss-bone);
        text-decoration: none;
      }
      .pager .next {
        margin-left: auto;
      }

      /* The value table: key and value in mono, hairline rows, no fills */
      dl {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        margin: 0 0 28px;
        border-top: 1px solid var(--gss-line);
        font-family: var(--gss-font-code);
        font-size: 13px;
      }
      dt,
      dd {
        margin: 0;
        padding: 10px 0;
        border-bottom: 1px solid var(--gss-line);
      }
      dt {
        color: var(--gss-dim);
        text-transform: lowercase;
      }
      dd code {
        font-size: inherit;
      }

      /* ----- Examples and their "Try it" button ----- */
      pre {
        margin: 0 0 16px;
        padding: 18px 20px;
        overflow-x: auto;
        border: 1px solid var(--gss-line);
        background: var(--gss-surface);
        font-size: 13px;
        line-height: 1.7;
      }
      .example-part {
        scroll-margin-top: 72px;
      }
      .example {
        position: relative;
      }
      .example pre {
        padding-right: 7rem; /* room for the button */
      }
      .example.is-open pre {
        display: none; /* the editor shows the same code */
      }
      .try {
        position: absolute;
        top: 10px;
        right: 10px;
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--gss-signal);
        border-radius: var(--gss-radius-control);
        background: var(--gss-surface);
        color: var(--gss-signal);
        font: 12px var(--gss-font-code);
        text-transform: lowercase;
        cursor: pointer;
        transition:
          color var(--gss-transition),
          background-color var(--gss-transition);
      }
      .try:hover {
        background: var(--gss-signal);
        color: var(--gss-void);
      }
      @media (pointer: coarse) {
        .try {
          height: 44px;
        }
      }

      /* ----- The live playground under an example ----- */
      .playground {
        overflow: hidden;
        margin: 0 0 12px;
        border: 1px solid var(--gss-line);
        background: var(--gss-surface);
        color: var(--gss-bone);
        font-family: var(--gss-font-code);
      }
      .playground-bar {
        display: flex;
        min-height: 44px;
        box-sizing: border-box;
        gap: 16px;
        align-items: center;
        padding: 0 7rem 0 14px; /* room for the Close button on the right */
        border-bottom: 1px solid var(--gss-line);
        font-size: 11px;
        color: var(--gss-dim);
      }
      .playground-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 320px;
      }
      /* The code: a CodeMirror editor (src/runtime/editor.ts) */
      .playground .code-host {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border-right: 1px solid var(--gss-line);
        font-size: 13px;
      }
      .open-playground {
        margin-left: auto;
        color: var(--gss-ash);
        text-transform: lowercase;
      }
      .open-playground:hover {
        color: var(--gss-bone);
        text-decoration: none;
      }
      .playground canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        background: var(--gss-void);
        touch-action: none;
        cursor: grab;
      }
      /* The panel of variables and the chips of the view lie over the render, in the same
         cell (src/playground/variables-panel.css, src/playground/view-chips.css) */
      .playground-body canvas,
      .playground-body .vars-panel,
      .playground-body .view-chips {
        grid-row: 1;
        grid-column: 2;
      }
      .playground pre.error {
        margin: 0;
        padding: 10px 14px;
        border: 0;
        border-left: 2px solid var(--gss-signal);
        background: var(--gss-signal-wash);
        color: var(--gss-error-text);
        font-size: 12px;
        white-space: pre-wrap;
      }
      /* "● ok" / "● error", like the playground's status bar */
      .status {
        text-transform: lowercase;
      }
      .status::before {
        content: "● ";
      }
      .status.error {
        color: var(--gss-signal);
      }
      @media (max-width: 600px) {
        .playground-body {
          grid-template-columns: 1fr;
          grid-template-rows: auto 240px;
          height: auto;
        }
        .playground .code-host {
          height: 200px;
          border-right: 0;
          border-bottom: 1px solid var(--gss-line);
        }
        .playground-body canvas,
        .playground-body .vars-panel,
        .playground-body .view-chips {
          grid-row: 2;
          grid-column: 1;
        }
        .hint {
          display: none;
        }
      }
    </style>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="89b55a0a-cc5f-44e3-9d29-1db01ff93bc9"
    ></script>
  </head>
  <body class="gss-dark">
    <header class="topbar">
      <a class="mark" href="./" aria-label="GSS home"
        >{<span class="dot"></span>}</a
      >
      <span class="crumb">/</span>
      <span>docs</span>
      <span class="spacer"></span>
      <a class="to-playground" href="./playground.html">playground →</a>
    </header>
    <main id="docs"></main>
    <footer class="docs-footer">
      GSS
      <a href="https://www.npmjs.com/package/gss-lang/v/%GSS_VERSION%"
        >v%GSS_VERSION%</a
      >
      · <a href="#installation">installation</a>
    </footer>
    <!-- First paint: one entry (hash or the first). enablePages takes over once the module runs.
         With JS disabled this script never runs, so the whole reference stays readable. -->
    <script>
      (() => {
        const docs = document.getElementById("docs");
        if (!docs || !docs.querySelector("article")) return;
        const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
        const base = raw.split("--")[0];
        const entries = [
          ...docs.querySelectorAll(":scope > section > article"),
        ];
        const byId = base && document.getElementById(base);
        const show =
          (byId && byId.matches("article") && byId) ||
          (base &&
            docs.querySelector(
              `:scope > section#${CSS.escape(base)} > article`,
            )) ||
          entries[0];
        if (!show) return;
        for (const article of entries) article.hidden = article !== show;
        for (const section of docs.querySelectorAll(":scope > section")) {
          section.hidden = !section.contains(show);
        }
        const header = docs.querySelector(":scope > header");
        if (header) header.hidden = show !== entries[0];
      })();
    </script>

  </body>
